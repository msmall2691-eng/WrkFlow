name: CI

# The repo had no CI: nothing checked a pull request before it reached
# Vercel, so a type error or a dead page only showed up in a preview deploy
# (or on mlinx.studio). These are the same three commands a contributor runs
# locally, in the order that makes a failure easy to attribute.
on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, smoke tests
    # Pinned, not `ubuntu-latest`. GitHub rolled that label to Ubuntu 26.04
    # between Nov 2 and Nov 8 2026, and `playwright install` then refuses the
    # image outright: "Playwright does not support chromium on
    # ubuntu26.04-x64". The job died at the install step, before a single test
    # ran, on a commit that had passed 18/18 on the same workflow six days
    # earlier. 24.04 is the image every green run on this repo actually used.
    #
    # This is a pin, so it is a debt: @playwright/test is on 1.56 and 1.65 is
    # current. Upgrading is the real fix and wants its own PR and a real CI
    # run. Do that before 24.04 is retired, then drop this line.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # The smoke suite's webServer runs `npm run build` itself, so the
      # production build is covered here rather than as a separate step.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
