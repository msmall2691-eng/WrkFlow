name: CI

# The repo had no CI: nothing checked a pull request before it reached
# Vercel, so a type error or a dead page only showed up in a preview deploy
# (or on mlinx.studio). These are the same three commands a contributor runs
# locally, in the order that makes a failure easy to attribute.
on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # The smoke suite's webServer runs `npm run build` itself, so the
      # production build is covered here rather than as a separate step.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
